name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Environment diagnostics
        run: |
          java -version || true
          echo "JAVA_HOME=$JAVA_HOME"
          ls -l gradlew gradle/wrapper/
          ./gradlew --version || true

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 build.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error title=gradle::${line}"
            done
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitlauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
