name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK as the v0.5.0-alpha prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  assemble:
    name: Build and verify APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Environment diagnostics
        run: |
          java -version || true
          echo "JAVA_HOME=$JAVA_HOME"
          ls -l gradlew gradle/wrapper/
          ./gradlew --version || true

      - name: Build debug and release APKs
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |^FAILURE:|^> Task .* FAILED|error:" build.log | head -n 60 | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error title=build::${line}"
            done
            tail -n 15 build.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error title=tail::${line}"
            done
            exit "$status"
          fi

      - name: Verify release signature and create checksum
        shell: bash
        working-directory: app/build/outputs/apk/release
        run: |
          set -euo pipefail
          test -f app-release.apk
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs app-release.apk | tee app-release-signature.txt
          grep -q 'CN=BitLauncher Test Release' app-release-signature.txt
          normalized=$(tr -d ':\r' < app-release-signature.txt | tr '[:upper:]' '[:lower:]')
          grep -q 'f88120254d87eab136a7f72412a78a5d5e6fdc8b628ba5689671557d358c6e3c' <<< "$normalized"
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bitlauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: bitlauncher-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/app-release-signature.txt
          if-no-files-found: error

  publish:
    name: Publish sideload prerelease
    needs: assemble
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: bitlauncher-release
          path: release

      - name: Publish APK and verification files
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c app-release.apk.sha256
          tag='v0.5.0-alpha'
          sha=$(awk '{print $1}' app-release.apk.sha256)
          notes="APK release non-debuggable untuk sideload Android 8.0+ (API 26+). Ditandatangani dengan test key publik, bukan kunci produksi/Play Store."
          notes="${notes}"$'\n\n'"Fitur 0.5.0: saklar independen untuk menampilkan/menyembunyikan daftar aplikasi artikel, serta hyperlink Manual dengan teks kustom, pilihan aplikasi, edit, dan hapus. Filter notifikasi, draf, multiline, kalender, Catatan, dan backup/restore tetap didukung."
          notes="${notes}"$'\n\n'"SHA-256: \`${sha}\`"$'\n\n'"Dibangun dan diverifikasi oleh [Android CI](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" app-release.apk app-release.apk.sha256 app-release-signature.txt --clobber
          else
            gh release create "$tag" app-release.apk app-release.apk.sha256 app-release-signature.txt               --target "$GITHUB_SHA"               --prerelease               --title 'BitLauncher 0.5.0 alpha — sideload test'               --notes "$notes"
          fi
